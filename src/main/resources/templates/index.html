
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Student Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            width: 85%;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .add-btn {
            display: inline-block;
            background-color: #28a745;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        .edit-btn {
            background-color: #ffc107;
            color: black;
            padding: 7px 12px;
            text-decoration: none;
            border-radius: 4px;
        }

        .delete-btn {
            background-color: #dc3545;
            color: white;
            padding: 7px 12px;
            text-decoration: none;
            border-radius: 4px;
        }

        .empty {
            text-align: center;
            color: gray;
            padding: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Student Management System</h1>

        <a th:href="@{/students/new}" class="add-btn">
            + Add Student
        </a>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Course</th>
                    <th>Age</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="student : ${students}">

                    <td th:text="${student.id}"></td>

                    <td th:text="${student.name}"></td>

                    <td th:text="${student.email}"></td>

                    <td th:text="${student.course}"></td>

                    <td th:text="${student.age}"></td>

                    <td>
                        <a th:href="@{/students/edit/{id}(id=${student.id})}"
                           class="edit-btn">
                            Edit
                        </a>

                        <a th:href="@{/students/delete/{id}(id=${student.id})}"
                           class="delete-btn"
                           onclick="return confirm('Are you sure you want to delete this student?');">
                            Delete
                        </a>
                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(students)}">
                    <td colspan="6" class="empty">
                        No students found. Click Add Student to register one.
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</body>
</html>
